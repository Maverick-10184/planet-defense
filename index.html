<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Defense v1.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Header with version */
        header {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00ff88;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .version {
            font-size: 12px;
            color: #00ff88;
            text-transform: uppercase;
        }

        .credits {
            font-size: 16px;
            color: #ffff00;
            font-weight: bold;
        }

        /* Navigation tabs */
        nav {
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            border-bottom: 2px solid #667eea;
        }

        nav button {
            flex: 1;
            padding: 12px;
            background: transparent;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav button:hover {
            background: rgba(102, 126, 234, 0.5);
        }

        nav button.active {
            background: #667eea;
            border-bottom: 3px solid #00ff88;
            color: #00ff88;
        }

        /* Main content area */
        main {
            flex: 1;
            overflow: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .content-section {
            display: none;
            flex: 1;
            animation: fadeIn 0.3s;
        }

        .content-section.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Home screen */
        .home-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .home-container h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .drone-list {
            display: grid;
            gap: 15px;
        }

        .drone-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .drone-item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            margin-right: 15px;
            accent-color: #667eea;
        }

        .drone-info {
            flex: 1;
        }

        .drone-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .drone-stats {
            font-size: 12px;
            color: #666;
        }

        /* Battle screen */
        .battle-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
        }

        #gameCanvas {
            flex: 1;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            border-radius: 8px;
            border: 2px solid #667eea;
            cursor: crosshair;
            touch-action: none;
        }

        .battle-ui {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
        }

        .battle-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .battle-stat label {
            font-size: 12px;
            color: #00ff88;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .battle-stat value {
            font-size: 20px;
            font-weight: bold;
            color: #ffff00;
        }

        .drone-upgrades {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .upgrade-btn {
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .upgrade-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .upgrade-btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .battle-controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-primary {
            padding: 12px 30px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #00dd77;
            transform: scale(1.05);
        }

        /* Drones screen */
        .drones-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            margin: auto;
        }

        .drones-container h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .drone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .drone-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .drone-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .drone-card p {
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .drone-stat-bar {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }

        .stat-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: #00ff88;
        }

        /* Shop screen */
        .shop-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            margin: auto;
        }

        .shop-container h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .shop-item {
            background: #f5f5f5;
            border: 2px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .shop-item h4 {
            color: #667eea;
            margin-bottom: 8px;
        }

        .shop-item p {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .shop-price {
            font-size: 18px;
            font-weight: bold;
            color: #ffff00;
            margin-bottom: 10px;
        }

        .shop-btn {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .shop-btn:hover {
            background: #764ba2;
        }

        /* Zoom indicator */
        .zoom-indicator {
            position: fixed;
            top: 60px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff88;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
            display: none;
        }

        .zoom-indicator.show {
            display: block;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-title">🛡️ PLANET DEFENSE</div>
            <div class="version">v1.2</div>
            <div class="credits">Credits: <span id="creditValue">1000</span></div>
        </header>

        <nav>
            <button class="nav-btn active" data-section="home">🏠 Home</button>
            <button class="nav-btn" data-section="battle">⚔️ Battle</button>
            <button class="nav-btn" data-section="drones">🤖 Drones</button>
            <button class="nav-btn" data-section="shop">🛒 Shop</button>
        </nav>

        <main>
            <!-- Home Screen -->
            <section id="home" class="content-section active">
                <div class="home-container">
                    <h2>Select Your Drones</h2>
                    <p style="color: #666; margin-bottom: 20px;">Choose which drones will defend the planet:</p>
                    <div class="drone-list" id="droneList"></div>
                </div>
            </section>

            <!-- Battle Screen -->
            <section id="battle" class="content-section">
                <div class="battle-container">
                    <canvas id="gameCanvas"></canvas>
                    <div class="battle-ui">
                        <div class="battle-stat">
                            <label>Planet Health</label>
                            <value id="healthValue">100</value>
                        </div>
                        <div class="battle-stat">
                            <label>Wave</label>
                            <value id="waveValue">1</value>
                        </div>
                        <div class="battle-stat">
                            <label>Enemies</label>
                            <value id="enemyValue">0</value>
                        </div>
                        <div class="battle-stat">
                            <label>Score</label>
                            <value id="scoreValue">0</value>
                        </div>
                    </div>
                    <div class="drone-upgrades" id="upgradeButtons"></div>
                    <div class="battle-controls">
                        <button class="btn-primary" id="startBattle">Start Battle</button>
                        <button class="btn-primary" id="endBattle">End Battle</button>
                    </div>
                </div>
            </section>

            <!-- Drones Screen -->
            <section id="drones" class="content-section">
                <div class="drones-container">
                    <h2>Your Drones</h2>
                    <div class="drone-grid" id="droneGrid"></div>
                </div>
            </section>

            <!-- Shop Screen -->
            <section id="shop" class="content-section">
                <div class="shop-container">
                    <h2>Upgrade Shop</h2>
                    <div class="shop-grid" id="shopGrid"></div>
                </div>
            </section>
        </main>
    </div>

    <div class="zoom-indicator" id="zoomIndicator">Zoom: <span id="zoomValue">100</span>%</div>

    <script>
        // Game state
        const gameState = {
            credits: 1000,
            health: 100,
            maxHealth: 100,
            wave: 1,
            score: 0,
            isGameActive: false,
            zoom: 1,
            selectedDrones: new Set(),
            drones: {
                sentinel: { name: 'Sentinel', damage: 10, speed: 5, range: 100, cost: 200 },
                scout: { name: 'Scout', damage: 5, speed: 15, range: 80, cost: 150 },
                tank: { name: 'Tank', damage: 8, speed: 2, range: 120, cost: 300 },
                laser: { name: 'Laser Drone', damage: 15, speed: 8, range: 150, cost: 400 }
            },
            upgrades: {
                damage: { level: 1, cost: 200, boost: 1.2 },
                speed: { level: 1, cost: 200, boost: 1.15 },
                range: { level: 1, cost: 200, boost: 1.1 }
            },
            enemies: [],
            projectiles: []
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;

        // Resize canvas
        function resizeCanvas() {
            if (canvas) {
                const section = document.getElementById('battle');
                const container = section.querySelector('.battle-container');
                canvas.width = container.clientWidth - 40;
                canvas.height = container.clientHeight - 40 - 200;
            }
        }

        // Initialize UI
        function initializeUI() {
            renderDroneList();
            renderDroneGrid();
            renderShopGrid();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        // Render drone selection on home screen
        function renderDroneList() {
            const list = document.getElementById('droneList');
            list.innerHTML = '';
            
            Object.entries(gameState.drones).forEach(([key, drone]) => {
                const item = document.createElement('div');
                item.className = 'drone-item';
                item.innerHTML = `
                    <input type="checkbox" id="drone-${key}" data-drone="${key}">
                    <div class="drone-info">
                        <div class="drone-name">${drone.name}</div>
                        <div class="drone-stats">Damage: ${drone.damage} | Speed: ${drone.speed} | Range: ${drone.range}</div>
                    </div>
                `;
                item.querySelector('input').addEventListener('change', (e) => {
                    if (e.target.checked) {
                        gameState.selectedDrones.add(key);
                    } else {
                        gameState.selectedDrones.delete(key);
                    }
                });
                list.appendChild(item);
            });
        }

        // Render drone grid on drones screen
        function renderDroneGrid() {
            const grid = document.getElementById('droneGrid');
            grid.innerHTML = '';
            
            Object.entries(gameState.drones).forEach(([key, drone]) => {
                const card = document.createElement('div');
                card.className = 'drone-card';
                const selected = gameState.selectedDrones.has(key) ? '✓ Selected' : 'Not Selected';
                card.innerHTML = `
                    <h3>${drone.name}</h3>
                    <p>Status: ${selected}</p>
                    <div class="drone-stat-bar">
                        <label>Damage:</label>
                        <div class="stat-bar">
                            <div class="stat-fill" style="width: ${(drone.damage / 20) * 100}%"></div>
                        </div>
                        <span>${drone.damage}</span>
                    </div>
                    <div class="drone-stat-bar">
                        <label>Speed:</label>
                        <div class="stat-bar">
                            <div class="stat-fill" style="width: ${(drone.speed / 20) * 100}%"></div>
                        </div>
                        <span>${drone.speed}</span>
                    </div>
                    <div class="drone-stat-bar">
                        <label>Range:</label>
                        <div class="stat-bar">
                            <div class="stat-fill" style="width: ${(drone.range / 200) * 100}%"></div>
                        </div>
                        <span>${drone.range}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Render shop
        function renderShopGrid() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            
            Object.entries(gameState.upgrades).forEach(([key, upgrade]) => {
                const item = document.createElement('div');
                item.className = 'shop-item';
                item.innerHTML = `
                    <h4>${key.charAt(0).toUpperCase() + key.slice(1)} Upgrade</h4>
                    <p>Level: ${upgrade.level}</p>
                    <p>+${Math.round((upgrade.boost - 1) * 100)}% boost per level</p>
                    <div class="shop-price">${upgrade.cost} credits</div>
                    <button class="shop-btn" onclick="buyUpgrade('${key}')">Buy</button>
                `;
                grid.appendChild(item);
            });
        }

        // Buy upgrade
        window.buyUpgrade = function(upgradeType) {
            const upgrade = gameState.upgrades[upgradeType];
            if (gameState.credits >= upgrade.cost) {
                gameState.credits -= upgrade.cost;
                upgrade.level++;
                upgrade.cost = Math.ceil(upgrade.cost * 1.1);
                updateCredits();
                renderShopGrid();
                alert(`${upgradeType} upgraded to level ${upgrade.level}!`);
            } else {
                alert('Not enough credits!');
            }
        };

        // Update credits display
        function updateCredits() {
            document.getElementById('creditValue').textContent = gameState.credits;
        }

        // Navigation
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
                
                e.target.classList.add('active');
                const sectionId = e.target.dataset.section;
                document.getElementById(sectionId).classList.add('active');
                
                if (sectionId === 'battle') {
                    resizeCanvas();
                }
            });
        });

        // Battle system
        document.getElementById('startBattle')?.addEventListener('click', () => {
            if (gameState.selectedDrones.size === 0) {
                alert('Please select at least one drone!');
                return;
            }
            gameState.isGameActive = true;
            gameState.wave = 1;
            gameState.score = 0;
            gameState.health = gameState.maxHealth;
            gameState.enemies = [];
            gameState.projectiles = [];
            updateBattleUI();
            spawnEnemies();
            gameLoop();
        });

        document.getElementById('endBattle')?.addEventListener('click', () => {
            gameState.isGameActive = false;
            gameState.credits += Math.floor(gameState.score / 10);
            updateCredits();
            alert(`Battle ended! Earned ${Math.floor(gameState.score / 10)} credits!`);
            if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Spawn enemies
        function spawnEnemies() {
            const count = gameState.wave + 2;
            for (let i = 0; i < count; i++) {
                gameState.enemies.push({
                    x: Math.random() * (canvas ? canvas.width : 400),
                    y: -30,
                    width: 30,
                    height: 30,
                    health: 20 + gameState.wave * 5,
                    speed: 2 + gameState.wave * 0.5
                });
            }
        }

        // Update battle UI
        function updateBattleUI() {
            document.getElementById('healthValue').textContent = gameState.health;
            document.getElementById('waveValue').textContent = gameState.wave;
            document.getElementById('enemyValue').textContent = gameState.enemies.length;
            document.getElementById('scoreValue').textContent = gameState.score;
        }

        // Game loop
        function gameLoop() {
            if (!gameState.isGameActive) return;

            if (ctx && canvas) {
                // Clear canvas
                ctx.fillStyle = 'rgba(26, 26, 46, 0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw planet
                ctx.save();
                ctx.scale(gameState.zoom, gameState.zoom);
                ctx.fillStyle = '#4CAF50';
                ctx.beginPath();
                ctx.arc(canvas.width / 2 / gameState.zoom, canvas.height - 50, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Update and draw enemies
                gameState.enemies = gameState.enemies.filter(enemy => {
                    enemy.y += enemy.speed;
                    
                    ctx.fillStyle = '#FF6B6B';
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    
                    // Enemy health bar
                    ctx.fillStyle = '#00FF00';
                    ctx.fillRect(enemy.x, enemy.y - 10, (enemy.health / 30) * enemy.width, 5);
                    
                    // Check if reached planet
                    if (enemy.y > canvas.height) {
                        gameState.health--;
                        return false;
                    }
                    return true;
                });

                // Draw drones
                let droneIndex = 0;
                gameState.selectedDrones.forEach(droneKey => {
                    const droneColor = ['#00FFFF', '#FF00FF', '#FFFF00', '#00FF00'][droneIndex];
                    const x = 50 + droneIndex * 80;
                    const y = canvas.height - 80;
                    
                    ctx.fillStyle = droneColor;
                    ctx.fillRect(x, y, 40, 40);
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, 40, 40);
                    
                    droneIndex++;
                });

                updateBattleUI();

                // Check game over
                if (gameState.health <= 0) {
                    gameState.isGameActive = false;
                    alert(`Game Over! Final Score: ${gameState.score}`);
                    gameState.credits += Math.floor(gameState.score / 10);
                    updateCredits();
                    return;
                }

                // Wave progression
                if (gameState.enemies.length === 0) {
                    gameState.wave++;
                    gameState.score += gameState.wave * 100;
                    spawnEnemies();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Zoom with Ctrl+Scroll
        document.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                gameState.zoom = Math.max(0.5, Math.min(2.5, gameState.zoom + delta));
                
                const zoomPercent = Math.round(gameState.zoom * 100);
                document.getElementById('zoomValue').textContent = zoomPercent;
                document.getElementById('zoomIndicator').classList.add('show');
                
                setTimeout(() => {
                    document.getElementById('zoomIndicator').classList.remove('show');
                }, 1000);
            }
        }, { passive: false });

        // Initialize
        initializeUI();
    </script>
</body>
</html>
